<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entity graph</title>
<link rel="stylesheet" href="https://esm.sh/@xyflow/react@12.11.6/dist/style.css">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #d9dce1; --text: #1f2328; --muted: #6b7280;
    --accent: #1a73e8; --error: #c62828;
    --c-call: #2f80ed; --c-import: #27ae60; --c-type_ref: #9b51e0; --c-var_ref: #f2994a; --c-generic: #8a8f98;
  }
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100%; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar .sep { width: 1px; height: 20px; background: var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--text); padding: 4px 12px; cursor: pointer; font: inherit; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  button.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  button.btn:hover { border-color: #b8bcc4; }
  button.btn:disabled { opacity: .5; cursor: default; }
  label.chk { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; }
  .status { color: var(--error); font-size: 12px; margin-left: auto; max-width: 50%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main { display: flex; flex: 1; min-height: 0; }
  .canvas { flex: 1; min-width: 0; position: relative; }
  .panel { flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; min-width: 240px; }
  .panel-top { overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; }
  .panel-tabs { display: flex; flex: none; background: var(--bg); border-bottom: 1px solid var(--line); }
  .panel-tabs button { border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); padding: 6px 14px; font: inherit; cursor: pointer; }
  .panel-tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .panel-tabs button:disabled { opacity: .5; cursor: default; }
  .panel-tabs .tab-file { color: var(--muted); font-size: 11px; }
  .panel-top[hidden] { display: none; }
  .divider { width: 5px; flex: none; cursor: col-resize; background: var(--line); }
  .divider:hover, .divider.active { background: var(--accent); }
  .code { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .code-head { display: flex; gap: 8px; align-items: baseline; padding: 6px 12px; font-size: 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .code-head b { word-break: break-all; }
  .code-head .meta { margin-left: auto; white-space: nowrap; }
  .code-body { overflow: auto; flex: 1 1 auto; font: 12px/18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .code-body table { border-collapse: collapse; min-width: 100%; }
  .code-body td { padding: 0 12px 0 0; white-space: pre; vertical-align: top; }
  .code-body td.ln { color: var(--muted); text-align: right; user-select: none; padding: 0 10px; background: var(--bg); position: sticky; left: 0; }
  .code-body tr.in { background: #fff8dc; }
  .code-body tr.hl { background: #ffe9a8; }
  .code-body tr.hl td.ln { background: #f5d97a; color: var(--text); }
  .refs li { flex-wrap: wrap; }
  .refs .site { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 11px/16px ui-monospace, Menlo, monospace; color: var(--accent); background: var(--bg); }
  .refs .site:hover { border-color: var(--accent); }
  .loc { color: var(--muted); font-weight: 400; }
  .ent.st-added, .box.st-added { border-color: #1a9c4a; border-width: 2px; border-style: solid; }
  .ent.st-modified, .box.st-modified { border-color: #e0a100; border-width: 2px; border-style: solid; }
  .ent.st-removed, .box.st-removed { border-color: #d64545; border-style: dashed; opacity: .55; }
  .react-flow__node.faded { opacity: .3; }
  .churn { font-weight: 600; }
  .churn .add { color: #1a9c4a; }
  .churn .del { color: #d64545; }
  .pill { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 9px; color: #fff; line-height: 16px; margin-left: 6px; vertical-align: middle; }
  .code-body tr.del { background: #ffe5e5; }
  .code-body tr.ins { background: #e3f6e6; }
  .code-body tr.del td.ln { background: #f7cccc; }
  .code-body tr.ins td.ln { background: #c9ead0; }
  .code-body tr.hl.del, .code-body tr.hl.ins { background: #ffe9a8; }
  .code-body table.diff td.ln { position: static; }
  .panel h2 { margin: 0; font-size: 14px; word-break: break-all; }
  .panel .meta { color: var(--muted); font-size: 12px; word-break: break-all; }
  .panel h3 { margin: 6px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .panel ul { margin: 0; padding-left: 0; list-style: none; }
  .panel li { padding: 2px 0; display: flex; gap: 6px; align-items: baseline; }
  .panel li button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-align: left; }
  .panel .empty { color: var(--muted); font-style: italic; }
  .panel .row { display: flex; gap: 6px; }
  .panel .err { color: var(--error); font-size: 12px; }
  .tag { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 8px; color: #fff; line-height: 15px; }
  .legend { margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }

  .ent { position: relative; border: 1.5px solid #999; border-radius: 6px; padding: 5px 44px 5px 10px; background: #fff; min-width: 90px; max-width: 320px; box-shadow: 0 1px 2px rgba(0,0,0,.08); box-sizing: border-box; height: 100%; }
  .zoom { position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid #b8bcc4; background: #fff; color: var(--text); font: 13px/16px monospace; padding: 0; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .zoom:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .box-actions { position: absolute; top: 2px; right: 4px; display: flex; gap: 4px; }
  .box-actions .zoom { position: static; }
  .ent-actions { position: absolute; top: -8px; right: -8px; display: flex; gap: 4px; }
  .ent-actions .zoom { position: static; }
  .zoom.on { background: var(--text); color: #fff; border-color: var(--text); }
  .edge-count { font: 600 10px sans-serif; text-anchor: middle; dominant-baseline: middle; paint-order: stroke; stroke: #fff; stroke-width: 3px; pointer-events: none; }
  .ent-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ent-sub { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .kind-folder   { background: #fdf1cf; border-color: #d4a12a; }
  .kind-module   { background: #dbe9fb; border-color: #4a86d1; }
  .kind-file     { background: #e3f4e5; border-color: #4caf50; }
  .kind-class    { background: #ece4f7; border-color: #7e57c2; }
  .kind-function { background: #ffffff; border-color: #a0a4ab; }
  .react-flow__node.selected .ent { box-shadow: 0 0 0 2px var(--accent); }
  .box { width: 100%; height: 100%; box-sizing: border-box; border: 1.5px dashed #999; border-radius: 8px; position: relative; }
  .box-label { position: absolute; top: 3px; left: 8px; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .box.kind-folder   { background: rgba(212,161,42,.07);  border-color: #d4a12a; }
  .box.kind-module   { background: rgba(74,134,209,.07);  border-color: #4a86d1; }
  .box.kind-file     { background: rgba(76,175,80,.07);   border-color: #4caf50; }
  .box.kind-class    { background: rgba(126,87,194,.07);  border-color: #7e57c2; }
  .box.kind-function { background: rgba(160,164,171,.07); border-color: #a0a4ab; }
  .react-flow__node.selected .box { box-shadow: 0 0 0 2px var(--accent); }
  .ent.is-test { background: #f1f5fb; border-style: dotted; }
  .box.is-test { background: rgba(90, 120, 190, .05); border-style: dotted; }
  .ent.is-test .ent-sub::after { content: ' · test'; color: #5a78be; }
  .react-flow__handle { opacity: 0; pointer-events: none; }
  .react-flow__node { cursor: grab; }

  /* --- syntax highlighting (hljs) --- */
  /* Dark, saturated tones throughout: they need to hold contrast on plain
     white rows and on the four tinted diff/highlight row backgrounds alike. */
  .hljs-comment, .hljs-quote { color: #63707e; font-style: italic; }
  .hljs-meta { color: #63707e; font-weight: 600; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal { color: #a4165c; font-weight: 600; }
  .hljs-string, .hljs-symbol, .hljs-doctag, .hljs-regexp { color: #0a5c1e; }
  .hljs-number { color: #9b4700; }
  .hljs-title, .hljs-title.function_, .hljs-function { color: #1552b0; font-weight: 600; }
  .hljs-type, .hljs-title.class_ { color: #6f3fa0; }
  .hljs-built_in, .hljs-attr, .hljs-variable { color: #0969a2; }
  .hljs-punctuation { color: #57606a; }

  /* --- hide-node button & bundle popover --- */
  /* The popover is the only thing in the viewport portal. Its own z-index
     cannot escape the transformed wrapper it sits in, so the portal layer is
     lifted above the nodes (a selected node is at 1000). */
  .react-flow__viewport-portal { z-index: 2000; }
  .bundle-pop {
    position: absolute; top: 22px; right: 0;
    display: flex; flex-direction: column; gap: 6px;
    width: 270px; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    font-size: 12px; color: var(--text); pointer-events: auto;
  }
  .bundle-hint { color: var(--muted); font-size: 11px; line-height: 1.35; }
  .bundle-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bundle-dim { color: var(--text); }
  .bundle-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .bundle-seg button { border: 0; border-left: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 2px 8px; font: inherit; cursor: pointer; }
  .bundle-seg button:first-child { border-left: 0; }
  .bundle-seg button.on { background: var(--accent); color: #fff; }
  .bundle-reset { align-self: flex-start; border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }

  /* --- inspector reference tree (onion grouping) --- */
  .ref-tree { font-size: 12px; }
  .ref-tree details { margin: 1px 0; }
  .ref-tree summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 6px; padding: 2px 0; }
  .ref-tree summary::-webkit-details-marker { display: none; }
  .ref-tree summary::before { content: '▸'; color: var(--muted); font-size: 9px; width: 10px; display: inline-block; }
  .ref-tree details[open] > summary::before { content: '▾'; }
  .ref-tree .grp-count { color: var(--muted); font-weight: 400; }
  .ref-tree .grp-body { padding-left: 12px; border-left: 1px solid var(--line); margin-left: 4px; }
  .ref-tree .group-path { color: var(--muted); font-size: 11px; padding: 2px 0 0; }
  .ref-tree .ref-leaf { padding-left: 12px; }
  .ref-tree .ref-row { padding: 2px 0; border-bottom: 1px dashed var(--line); }
  .ref-tree .ref-row:last-child { border-bottom: none; }
  .ref-tree .row-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .ref-tree .row-head button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-align: left; }
  .ref-tree .site-line { display: flex; align-items: baseline; gap: 6px; padding: 1px 0 1px 8px; }
  .ref-tree .site { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 11px/16px ui-monospace, Menlo, monospace; color: var(--accent); background: var(--bg); cursor: pointer; flex: none; }
  .ref-tree .site:hover { border-color: var(--accent); }
  .ref-tree .site-text { font: 11px/16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  /* --- global search --- */
  .search { position: relative; margin-left: auto; }
  .search input { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font: inherit; width: 240px; background: var(--panel); color: var(--text); }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search-list { position: absolute; top: 100%; right: 0; margin-top: 4px; width: 460px; max-height: 60vh; overflow: auto; z-index: 3000; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .search-row { display: flex; gap: 8px; align-items: baseline; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  .search-row.on { background: #e8f0fe; }
  .search-row .kind { font-size: 10px; color: var(--muted); width: 52px; flex: none; }
  .search-row .name { flex: none; }
  .search-row .path { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  .search-empty { padding: 4px 10px; color: var(--muted); font-style: italic; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "@xyflow/react": "https://esm.sh/@xyflow/react@12.11.6?deps=react@18.3.1,react-dom@18.3.1",
    "@dagrejs/dagre": "https://esm.sh/@dagrejs/dagre@1.1.8",
    "htm": "https://esm.sh/htm@3.1.1",
    "highlight.js/lib/core": "https://esm.sh/highlight.js@11.11.1/lib/core",
    "highlight.js/lib/languages/": "https://esm.sh/highlight.js@11.11.1/lib/languages/"
  }
}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="./ui/app.js"></script>
</body>
</html>
