[package]
name = "graph-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Throwaway localhost viewer: serves an EntityGraph (raw and coalesced) to a React Flow page. Delete this directory to remove it."

[[bin]]
name = "graph-server"
path = "src/main.rs"

[features]
default = ["treesitter"]
treesitter = ["dep:treesitter-producer"]
scip = ["dep:scip-producer"]

[dependencies]
entity-graph = { workspace = true }
coalesce = { workspace = true }
treesitter-producer = { workspace = true, optional = true }
scip-producer = { workspace = true, optional = true }
anyhow = { workspace = true }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
entity-graph = { workspace = true, features = ["test-support"] }
