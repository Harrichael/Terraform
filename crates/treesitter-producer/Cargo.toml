[package]
name = "treesitter-producer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Produces an EntityGraph from source files using tree-sitter and name-based reference resolution."

[dependencies]
entity-graph = { workspace = true }
anyhow = { workspace = true }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-sequel = "0.3"

[dev-dependencies]
tempfile = "3"
entity-graph = { workspace = true, features = ["test-support"] }
